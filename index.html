<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Счётчик медитаций</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500&family=Sora:wght@300&display=swap">
<style>
  /* Layout: one screen, one glowing rainbow button with the number on it. */
  :root {
    --bg: #e9eef0;
    --bg-deep: #d7e0e3;
    --muted: #5f7179;
    --fg: #22323a;
    --font-display: "Sora", "Manrope", system-ui, sans-serif;
    --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #121a21; --bg-deep: #0b1116; --muted: #8c9ea5; --fg: #dfe8ea; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #121a21; --bg-deep: #0b1116; --muted: #8c9ea5; --fg: #dfe8ea; color-scheme: dark; }

  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, var(--bg) 40%, var(--bg-deep) 100%) fixed, var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3.5rem;
    padding-block: 2rem;
  }

  @property --spin { syntax: "<angle>"; inherits: true; initial-value: 0deg; }
  .breath {
    --rainbow: conic-gradient(from var(--spin), #ff2d55, #ff9500, #ffdd00, #34e27a, #00c2ff, #5b5bff, #c13bff, #ff2d55);
    position: relative;
    width: min(70vw, 17rem);
    aspect-ratio: 1;
    max-width: 100%;
    animation: spin 8s linear infinite;
  }
  /* Two glow layers: a wide soft aura and a tight bright ring. */
  .breath::before, .breath::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: var(--rainbow);
    pointer-events: none;
  }
  .breath::before { inset: -22%; filter: blur(40px) saturate(1.6); opacity: .95; animation: breathe 6s ease-in-out infinite; }
  .breath::after { inset: -5%; filter: blur(14px) saturate(1.8); opacity: 1; }
  @keyframes breathe { 0%, 100% { transform: scale(.9); } 50% { transform: scale(1.06); } }
  @keyframes spin { to { --spin: 360deg; } }

  #add {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    border: 0;
    border-radius: 50%;
    background: var(--rainbow);
    color: #fff;
    font-family: var(--font-display);
    font-weight: 300;
    font-size: clamp(3.5rem, 18vw, 6rem);
    font-variant-numeric: tabular-nums;
    line-height: 1;
    text-shadow: 0 2px 12px rgba(0, 0, 0, .4);
    cursor: pointer;
    filter: saturate(1.3);
    transition: transform .15s ease;
  }
  #add::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 38%, rgba(255,255,255,.4), rgba(255,255,255,0) 62%);
    pointer-events: none;
  }
  #add:active { transform: scale(.96); }
  #add:focus-visible { outline: 3px solid var(--fg); outline-offset: 10px; }
  #add.flash { animation: flash .6s ease-out; }
  @keyframes flash { 0% { filter: saturate(1.3) brightness(1.5); } 100% { filter: saturate(1.3); } }

  .links { display: flex; flex-wrap: wrap; justify-content: center; gap: .25rem 1rem; }
  .link {
    border: 0; background: none; padding: .4rem .6rem; border-radius: 999px;
    color: var(--muted); font: 500 .85rem var(--font-body); cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .link:hover { color: var(--fg); }
  .link:focus-visible { outline: 2px solid var(--fg); }
  #edit-form { display: flex; gap: .5rem; align-items: center; }
  #edit-input {
    width: 8rem; padding: .55rem .75rem; border-radius: 12px;
    border: 1px solid var(--muted); background: var(--bg); color: var(--fg);
    font: 500 1.1rem var(--font-body); text-align: center; font-variant-numeric: tabular-nums;
  }
  #edit-save {
    padding: .6rem 1rem; border-radius: 12px; border: 0; cursor: pointer;
    background: var(--fg); color: var(--bg); font: 500 .95rem var(--font-body);
  }
  .note { margin: 0; font-size: .8rem; color: var(--muted); max-width: 32ch; text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    .breath, .breath::before, #add.flash { animation: none; }
    #add { transition: none; }
  }
</style>

<main>
  <div class="breath">
    <button id="add" type="button" aria-label="Добавить медитацию">0</button>
  </div>
  <div class="links">
    <button class="link" id="undo" type="button" hidden>Отменить последнюю</button>
    <button class="link" id="edit" type="button">Изменить число</button>
  </div>
  <form id="edit-form" hidden>
    <input id="edit-input" type="number" inputmode="numeric" min="0" step="1" aria-label="Сколько медитаций уже сделано">
    <button id="edit-save" type="submit">Сохранить</button>
  </form>
  <p class="note" id="note" hidden></p>
</main>

<script>
(function () {
  const LS_KEY = "meditation-counter-v1";
  const els = {
    add: document.getElementById("add"),
    undo: document.getElementById("undo"),
    note: document.getElementById("note"),
    edit: document.getElementById("edit"),
    form: document.getElementById("edit-form"),
    input: document.getElementById("edit-input"),
  };

  // state: { count, days: { "YYYY-MM-DD": n }, last: [ISO,...] (last few, for undo) }
  let state = { count: 0, days: {}, last: [] };
  let ref = null;
  let writing = Promise.resolve();

  function dayKey(d = new Date()) {
    const p = n => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }

  function render() {
    els.add.textContent = state.count.toLocaleString("ru-RU");
    els.add.setAttribute("aria-label", "Медитаций: " + state.count + ". Нажмите, чтобы добавить");
    els.undo.hidden = !(state.last && state.last.length);
  }

  function saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  }
  function loadLocal() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && typeof s.count === "number") return s;
      }
    } catch (e) {}
    return null;
  }

  function showNote(text) {
    els.note.textContent = text;
    els.note.hidden = !text;
  }

  function persist() {
    saveLocal();
    if (!ref) return;
    const body = JSON.parse(JSON.stringify(state));
    writing = writing.then(() => ref.set(body)).catch(() => {
      showNote("Не получилось сохранить в облако. Число сохранено на этом устройстве.");
    });
  }

  els.add.addEventListener("click", () => {
    const now = new Date();
    const k = dayKey(now);
    state.count += 1;
    state.days[k] = (state.days[k] || 0) + 1;
    state.last = (state.last || []).concat(now.toISOString()).slice(-5);
    els.add.classList.remove("flash"); void els.add.offsetWidth; els.add.classList.add("flash");
    render(); persist();
  });

  els.undo.addEventListener("click", () => {
    if (!state.last || !state.last.length || state.count <= 0) return;
    const iso = state.last[state.last.length - 1];
    const k = dayKey(new Date(iso));
    state.last = state.last.slice(0, -1);
    state.count -= 1;
    if (state.days[k]) {
      state.days[k] -= 1;
      if (state.days[k] <= 0) delete state.days[k];
    }
    render(); persist();
  });

  els.edit.addEventListener("click", () => {
    const open = els.form.hidden;
    els.form.hidden = !open;
    if (open) { els.input.value = String(state.count); els.input.focus(); els.input.select(); }
  });

  els.form.addEventListener("submit", e => {
    e.preventDefault();
    const n = Math.floor(Number(els.input.value));
    if (!Number.isFinite(n) || n < 0) { showNote("Впишите целое число от 0."); return; }
    state.count = n;
    state.last = [];
    els.form.hidden = true;
    showNote("");
    render(); persist();
  });

  const local = loadLocal();
  if (local) state = Object.assign({ days: {}, last: [] }, local);
  render();

  async function connect() {
    if (!window.claude || !window.claude.use) return;
    try {
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      ref = db.doc("data/users/" + id + "/counter");
      let settled = false;
      const timer = setTimeout(() => {
        if (!settled) showNote("Облако пока не отвечает. Нажатия сохраняются на этом устройстве.");
      }, 10000);
      ref.onSnapshot(snap => {
        if (snap.exists) {
          const d = snap.data();
          if (d && typeof d.count === "number") {
            state = { count: d.count, days: Object.assign({}, d.days || {}), last: (d.last || []).slice() };
            saveLocal();
            render();
          }
        } else if (!snap.metadata.fromCache && state.count > 0 && !settled) {
          persist();
        }
        if (!snap.metadata.fromCache && !settled) {
          settled = true; clearTimeout(timer); showNote("");
        }
      }, () => {
        settled = true; clearTimeout(timer);
        ref = null;
        showNote("Облако недоступно. Нажатия сохраняются на этом устройстве.");
      });
    } catch (e) {}
  }
  connect();
})();
</script>
