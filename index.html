<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Счётчик медитаций</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500&family=Sora:wght@300&display=swap">
<style>
  /* Layout: one screen, one glowing rainbow button with the number on it. */
  :root {
    --bg: #e9eef0;
    --bg-deep: #d7e0e3;
    --muted: #5f7179;
    --fg: #22323a;
    --font-display: "Sora", "Manrope", system-ui, sans-serif;
    --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #121a21; --bg-deep: #0b1116; --muted: #8c9ea5; --fg: #dfe8ea; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #121a21; --bg-deep: #0b1116; --muted: #8c9ea5; --fg: #dfe8ea; color-scheme: dark; }

  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, var(--bg) 40%, var(--bg-deep) 100%) fixed, var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3.5rem;
    padding-block: 2rem;
  }

  @property --spin { syntax: "<angle>"; inherits: true; initial-value: 0deg; }
  .breath {
    --rainbow: conic-gradient(from var(--spin), #ff2d55, #ff9500, #ffdd00, #34e27a, #00c2ff, #5b5bff, #c13bff, #ff2d55);
    position: relative;
    width: min(70vw, 17rem);
    aspect-ratio: 1;
    max-width: 100%;
    animation: spin 8s linear infinite;
  }
  /* Two glow layers: a wide soft aura and a tight bright ring. */
  .breath::before, .breath::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: var(--rainbow);
    pointer-events: none;
  }
  .breath::before { inset: -22%; filter: blur(40px) saturate(1.6); opacity: .95; animation: breathe 6s ease-in-out infinite; }
  .breath::after { inset: -5%; filter: blur(14px) saturate(1.8); opacity: 1; }
  @keyframes breathe { 0%, 100% { transform: scale(.9); } 50% { transform: scale(1.06); } }
  @keyframes spin { to { --spin: 360deg; } }

  #add {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    border: 0;
    border-radius: 50%;
    background: var(--rainbow);
    color: #fff;
    font-family: var(--font-display);
    font-weight: 300;
    font-size: clamp(3.5rem, 18vw, 6rem);
    font-variant-numeric: tabular-nums;
    line-height: 1;
    text-shadow: 0 2px 12px rgba(0, 0, 0, .4);
    cursor: pointer;
    filter: saturate(1.3);
    transition: transform .15s ease;
  }
  #add::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 38%, rgba(255,255,255,.4), rgba(255,255,255,0) 62%);
    pointer-events: none;
  }
  #add:active { transform: scale(.96); }
  #add:focus-visible { outline: 3px solid var(--fg); outline-offset: 10px; }
  #add.flash { animation: flash .6s ease-out; }
  @keyframes flash { 0% { filter: saturate(1.3) brightness(1.5); } 100% { filter: saturate(1.3); } }

  .links { display: flex; flex-wrap: wrap; justify-content: center; gap: .25rem 1rem; }
  .link {
    border: 0; background: none; padding: .4rem .6rem; border-radius: 999px;
    color: var(--muted); font: 500 .85rem var(--font-body); cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .link:hover { color: var(--fg); }
  .link:focus-visible { outline: 2px solid var(--fg); }
  #edit-form { display: flex; gap: .5rem; align-items: center; }
  #edit-input {
    width: 8rem; padding: .55rem .75rem; border-radius: 12px;
    border: 1px solid var(--muted); background: var(--bg); color: var(--fg);
    font: 500 1.1rem var(--font-body); text-align: center; font-variant-numeric: tabular-nums;
  }
  #edit-save {
    padding: .6rem 1rem; border-radius: 12px; border: 0; cursor: pointer;
    background: var(--fg); color: var(--bg); font: 500 .95rem var(--font-body);
  }
  .note { margin: 0; font-size: .8rem; color: var(--muted); max-width: 32ch; text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    .breath, .breath::before, #add.flash { animation: none; }
    #add { transition: none; }
  }
</style>

<main>
  <div class="breath">
    <button id="add" type="button" aria-label="Добавить медитацию">0</button>
  </div>
  <div class="links">
    <button class="link" id="undo" type="button" hidden>Отменить последнюю</button>
    <button class="link" id="edit" type="button">Изменить число</button>
  </div>
  <form id="edit-form" hidden>
    <input id="edit-input" type="number" inputmode="numeric" min="0" step="1" aria-label="Сколько медитаций уже сделано">
    <button id="edit-save" type="submit">Сохранить</button>
  </form>
  <p class="note" id="note" hidden></p>
</main>

<script>
(function () {
  const LS_KEY = "meditation-counter-v2";
  const els = {
    add: document.getElementById("add"),
    undo: document.getElementById("undo"),
    note: document.getElementById("note"),
    edit: document.getElementById("edit"),
    form: document.getElementById("edit-form"),
    input: document.getElementById("edit-input"),
  };

  // count: last value the storage confirmed; pending: taps not yet saved there.
  let state = { count: 0, pending: 0 };
  let sessionTaps = 0;   // taps made on this open page, for "undo"
  let backend = null;    // { add(delta) -> Promise<count>, set(n) -> Promise<count> }
  let busy = false;

  const shown = () => Math.max(0, state.count + state.pending);

  function render() {
    els.add.textContent = shown().toLocaleString("ru-RU");
    els.add.setAttribute("aria-label", "Медитаций: " + shown() + ". Нажмите, чтобы добавить");
    els.undo.hidden = sessionTaps <= 0;
  }

  function showNote(text) {
    els.note.textContent = text;
    els.note.hidden = !text;
  }

  function saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  }
  function loadLocal() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && typeof s.count === "number") return { count: s.count, pending: Number(s.pending) || 0 };
      }
      const old = JSON.parse(localStorage.getItem("meditation-counter-v1") || "null");
      if (old && typeof old.count === "number") return { count: old.count, pending: 0 };
    } catch (e) {}
    return null;
  }

  // Send unsaved taps to the storage, one request at a time.
  async function flush() {
    saveLocal();
    if (!backend || busy || state.pending === 0) return;
    busy = true;
    const d = state.pending;
    try {
      const count = await backend.add(d);
      state.pending -= d;
      state.count = count;
      showNote("");
    } catch (e) {
      showNote("Нет связи с базой. Нажатия сохранятся, когда связь вернётся.");
    }
    busy = false;
    saveLocal();
    render();
    if (state.pending !== 0 && els.note.hidden) flush();
  }

  els.add.addEventListener("click", () => {
    state.pending += 1;
    sessionTaps += 1;
    els.add.classList.remove("flash"); void els.add.offsetWidth; els.add.classList.add("flash");
    render(); flush();
  });

  els.undo.addEventListener("click", () => {
    if (sessionTaps <= 0 || shown() <= 0) return;
    state.pending -= 1;
    sessionTaps -= 1;
    render(); flush();
  });

  els.edit.addEventListener("click", () => {
    const open = els.form.hidden;
    els.form.hidden = !open;
    if (open) { els.input.value = String(shown()); els.input.focus(); els.input.select(); }
  });

  els.form.addEventListener("submit", async e => {
    e.preventDefault();
    const n = Math.floor(Number(els.input.value));
    if (!Number.isFinite(n) || n < 0) { showNote("Впишите целое число от 0."); return; }
    els.form.hidden = true;
    sessionTaps = 0;
    if (!backend) { state = { count: n, pending: 0 }; saveLocal(); render(); return; }
    state = { count: state.count, pending: n - state.count };
    render();
    try {
      state = { count: await backend.set(n), pending: 0 };
      showNote("");
    } catch (err) {
      showNote("Нет связи с базой. Число сохранится, когда связь вернётся.");
    }
    saveLocal(); render();
  });

  window.addEventListener("online", flush);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { refresh(); } });

  // --- Storage 1: the claude.ai artifact database (when opened on claude.ai) ---
  async function connectClaude() {
    if (!window.claude || !window.claude.use) return false;
    try {
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (!db || !user) return false;
      const id = await user.id();
      if (!id) return false;
      const ref = db.doc("data/users/" + id + "/counter");
      let latest = null;
      const first = await ref.get();
      if (first.exists && typeof first.data().count === "number") latest = first.data().count;
      backend = {
        add: async d => { const n = Math.max(0, (latest || 0) + d); await ref.set({ count: n }); latest = n; return n; },
        set: async n => { await ref.set({ count: n }); latest = n; return n; },
        get: async () => latest,
      };
      ref.onSnapshot(snap => {
        if (snap.exists && !snap.metadata.hasPendingWrites && typeof snap.data().count === "number") {
          latest = snap.data().count;
          if (!busy) { state.count = latest; saveLocal(); render(); }
        }
      }, () => {});
      return { initial: latest };
    } catch (e) { return false; }
  }

  // --- Storage 2: the Vercel database (/api/count) ---
  async function api(method, body) {
    const r = await fetch("/api/count", {
      method,
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
      cache: "no-store",
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { const err = new Error(data.error || "http_" + r.status); err.code = data.error; throw err; }
    return data;
  }
  async function connectServer() {
    if (location.protocol === "file:") return false;
    try {
      const data = await api("GET");
      backend = {
        add: async d => (await api("POST", { op: "add", by: d })).count,
        set: async n => (await api("POST", { op: "set", value: n })).count,
        get: async () => (await api("GET")).count,
      };
      return { initial: data.count };
    } catch (e) {
      if (e.code === "database_not_connected") showNote("База не подключена. Число сохраняется только на этом устройстве.");
      return false;
    }
  }

  async function refresh() {
    if (!backend || busy || !backend.get) return;
    try {
      const c = await backend.get();
      if (typeof c === "number" && !busy) { state.count = c; saveLocal(); render(); }
      flush();
    } catch (e) {}
  }

  const local = loadLocal();
  if (local) state = local;
  render();

  (async function start() {
    const conn = (await connectClaude()) || (await connectServer());
    if (!conn) return;
    if (conn.initial === null || conn.initial === undefined) {
      // Storage is empty: move what this device has into it.
      const n = shown();
      state = { count: 0, pending: 0 };
      if (n > 0) {
        try { state.count = await backend.set(n); } catch (e) { state.pending = n; }
      }
    } else {
      state.count = conn.initial;
    }
    saveLocal(); render(); flush();
  })();
})();
</script>
